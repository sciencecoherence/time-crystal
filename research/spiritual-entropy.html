<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=../mobile/spiritual-entropy.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiritual Entropy — Redirecting</title>
  <style>
    :root {
      --bg: #05070d;
      --panel: rgba(14, 18, 28, 0.94);
      --line: rgba(140, 160, 210, 0.18);
      --text: #d0d7e8;
      --text-dim: #8d98b3;
      --accent: #a46a54;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(164, 106, 84, 0.15), transparent 32%),
        radial-gradient(circle at bottom, rgba(122, 168, 232, 0.1), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: "Jost", "Segoe UI", sans-serif;
    }

    .panel {
      width: min(640px, 100%);
      padding: 32px;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: var(--panel);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(38px, 7vw, 56px);
      font-weight: 500;
      line-height: 1.05;
    }

    p {
      margin: 0;
      color: var(--text-dim);
      line-height: 1.6;
    }

    .links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .links a {
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <section class="panel">
    <h1>Spiritual Entropy</h1>
    <p>Opening the current essay build. If the redirect does not fire automatically, use one of the links below.</p>
    <div class="links">
      <a href="../mobile/spiritual-entropy.html">Open Essay</a>
      <a href="index.html">Research Hub</a>
      <a href="../index.html">Portal</a>
    </div>
  </section>
</body>
</html>
